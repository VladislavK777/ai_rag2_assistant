[project]
name = "rag2-backend"
version = "0.1.0"
description = "RAG2 — корпоративная AI-платформа: backend (FastAPI + LangGraph)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.6",
    "redis>=6.4",
    "qdrant-client>=1.19,<1.20",
    "miniopy-async>=1.23",
    "httpx>=0.27",
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-api>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44",
    "prometheus-client>=0.26",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
stt = ["nemo-toolkit[asr]>=2.0", "torch>=2.4", "onnxruntime-gpu"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx", "ruff>=0.6", "mypy>=1.11", "locust>=2.29"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
