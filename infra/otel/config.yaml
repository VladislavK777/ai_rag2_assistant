receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 2s
    limit_mib: 512
  # Маскирование PII в атрибутах спанов перед экспортом
  attributes/mask_pii:
    actions:
      - key: user.email
        action: hash
      - key: http.request.body
        action: delete

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
  # loki-exporter удалён из collector-contrib (deprecated 2024).
  # Loki 3.x принимает OTLP нативно на /otlp — используем otlphttp.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  # Собственная телеметрия collector'а на 0.0.0.0:8888.
  # Синтаксис readers — с v0.123 старый `metrics.address` игнорируется
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/mask_pii, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/mask_pii, batch]
      exporters: [otlphttp/loki]