# RAG2 MVP — полный стек (on-premise, 1 сервер)
# Control Plane: backend, workers, frontend, gateway
# Data Plane: postgres, qdrant, minio, redis, vault, GPU-сервисы

name: rag2

x-logging: &default-logging
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

services:
  # ============ Data Plane ============

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PG18+: данные в /var/lib/postgresql/<major> — монтируем родителя
      - pgdata:/var/lib/postgresql
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
    logging: *default-logging

  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/documents &&
      mc mb --ignore-existing local/audio &&
      mc version enable local/documents &&
      echo 'MinIO buckets ready'"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [data]

  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal, data]
    logging: *default-logging

  vault:
    image: hashicorp/vault:1.21
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_ADDR: http://0.0.0.0:8200
    networks: [data]
    logging: *default-logging

  # ============ GPU-сервисы (Data Plane) ============
  # Поднимаются только с профилем gpu: docker compose --profile gpu up -d
  # На машинах без NVIDIA GPU (Mac) используйте docker-compose.local.yml

  vllm:
    image: vllm/vllm-openai:v0.28.0
    profiles: ["gpu"]
    command: >
      --model ${LLM_MODEL}
      --max-model-len ${VLLM_MAX_MODEL_LEN}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS}
      --enable-prefix-caching
      --quantization awq
      --served-model-name rag2-llm
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks: [data]
    logging: *default-logging

  embedding:
    profiles: ["gpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
    command: >
      --model-id ${EMBEDDING_MODEL}
      --max-client-batch-size 32
      --port 80
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - hf_cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks: [data]
    logging: *default-logging

  reranker:
    profiles: ["gpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
    command: >
      --model-id ${RERANKER_MODEL}
      --port 80
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - hf_cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks: [data]
    logging: *default-logging

  guardrail:
    profiles: ["gpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
    command: >
      --model-id ${GUARD_MODEL}
      --port 80
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
    volumes:
      - hf_cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    networks: [data]
    logging: *default-logging

  stt:
    profiles: ["gpu"]
    build:
      context: ../backend
      dockerfile: docker/Dockerfile.stt
    command: python -m app.services.stt_server --model ${STT_MODEL}
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      STT_MODEL: ${STT_MODEL}
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    networks: [data]
    logging: *default-logging

  # ============ Control Plane ============

  backend:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      VLLM_BASE_URL: http://vllm:8000/v1
      EMBEDDING_URL: http://embedding:80
      RERANKER_URL: http://reranker:80
      GUARD_URL: http://guardrail:80
      STT_URL: http://stt:8080
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.ru}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme-admin}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: rag2-backend
    networks: [internal, data]
    logging: *default-logging

  ingestion-worker:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    command: celery -A app.services.celery_app worker -Q ingestion -c 2 --max-tasks-per-child=50
    depends_on:
      backend: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      EMBEDDING_URL: http://embedding:80
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: rag2-ingestion
    # Celery-воркер не слушает HTTP; ps/pgrep в slim-образе нет — проверяем
    # /proc: у celery-мастера cmdline содержит "celery"
    healthcheck:
      test: ["CMD-SHELL", "grep -lq celery /proc/*/cmdline 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [internal, data]
    logging: *default-logging

  stt-worker:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    command: celery -A app.services.celery_app worker -Q stt -c 1
    depends_on:
      backend: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STT_URL: http://stt:8080
      VLLM_BASE_URL: http://vllm:8000/v1
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: rag2-stt
    networks: [internal, data]
    logging: *default-logging

  # ============ DMZ ============

  frontend:
    build:
      context: ../frontend
    networks: [dmz]
    logging: *default-logging

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks: [dmz, internal]
    logging: *default-logging

  # ============ Observability ============

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [observability, internal]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      # Приём метрик от otel-collector (prometheusremotewrite exporter)
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    environment:
      # для authorization.credentials в prometheus.yml ($$QDRANT_API_KEY)
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks: [observability, internal, data]
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks: [observability, dmz]
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.7
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks: [observability]
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks: [observability, dmz]
    logging: *default-logging

volumes:
  pgdata:
  qdrant_data:
  minio_data:
  hf_cache:
  prom_data:
  grafana_data:
  loki_data:

networks:
  dmz:
  internal:
  data:
    internal: true
  observability:
